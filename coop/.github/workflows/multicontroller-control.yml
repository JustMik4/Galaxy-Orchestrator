name: multicontroller-control
on:
  workflow_dispatch:
    inputs:
      request:
        description: "JSON request from the task root; read current control Issue version first"
        required: true
        type: string
concurrency:
  group: multicontroller-control-v1
  cancel-in-progress: false
  queue: max
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  coordinate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Process serialized operation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .multicontroller/tools/coordinator.py
